  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #f5f6fa;
      --surface:       #ffffff;
      --border:        #e4e7ef;
      --text-primary:  #1a1d2e;
      --text-secondary:#6b7280;
      --accent:        #4f6ef7;
      --accent-light:  #eef1fe;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:     0 4px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
      --shadow-lg:     0 10px 32px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.07);
      --radius-sm:     8px;
      --radius-md:     14px;
      --radius-lg:     20px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* ─── Header ───────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 52px 24px 44px;
      text-align: center;
    }

    header .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -.025em;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    header p {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 520px;
      margin: 0 auto;
    }

    /* ─── Main wrapper ─────────────────────────────────────────────────── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 52px 24px 88px;
    }

    /* ─── Section headings ─────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text-primary);
      margin-bottom: 28px;
    }

    /* ─── Map section ──────────────────────────────────────────────────── */
    #map-section { margin-bottom: 80px; }

    #map {
      width: 100%;
      height: 540px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* ─── Mapbox popup overrides ───────────────────────────────────────── */
    .mapboxgl-popup-content {
      padding: 0 !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-lg) !important;
      border: 1px solid var(--border) !important;
      overflow: hidden;
      min-width: 240px;
      max-width: 280px;
    }

    .mapboxgl-popup-close-button {
      font-size: 18px;
      color: var(--text-secondary);
      padding: 8px 10px;
      line-height: 1;
      z-index: 10;
      background: rgba(255,255,255,.85);
      border-radius: 0 var(--radius-md) 0 var(--radius-sm);
    }

    .mapboxgl-popup-close-button:hover { color: var(--text-primary); background: rgba(255,255,255,.95); }
    .mapboxgl-popup-tip { border-top-color: var(--surface) !important; }

    /* popup card */
    .popup-card { display: flex; flex-direction: column; }

    .popup-card .popup-photo {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
      background: var(--accent-light);
    }

    .popup-card .popup-body { padding: 14px 16px 16px; }

    .popup-card .popup-name {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .popup-card .popup-title {
      font-size: .78rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .popup-card .popup-location {
      font-size: .75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .popup-card .popup-bio {
      font-size: .8rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* ─── Custom marker pin ────────────────────────────────────────────── */
    /*
     * .marker-wrap  — the element Mapbox anchors to (no transform, so
     *                  Mapbox pixel math stays accurate at every zoom level).
     * .marker-pin   — purely visual: rotated diamond with photo inside.
     *                  Lives inside the wrapper so its transform never
     *                  affects the anchor point Mapbox uses.
     */
    .marker-wrap {
      width: 0;
      height: 0;
      position: relative;
      cursor: pointer;
    }

    .marker-pin {
      width: 40px;
      height: 40px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: var(--accent);
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,.35);
      overflow: hidden;
      position: absolute;
      bottom: 0;
      left: -20px;
      transition: box-shadow .2s;
    }

    .marker-wrap:hover .marker-pin {
      box-shadow: 0 5px 16px rgba(0,0,0,.45);
    }

    .marker-pin img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Counter-rotate the image so it appears upright inside the diamond */
      transform: rotate(45deg) scale(1.35);
      display: block;
    }

    /* ─── Filter bar ───────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: -12px 0 20px;
    }

    .filter-btn {
      font-family: inherit;
      font-size: .82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

    .filter-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .filter-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .filter-btn .filter-count {
      margin-left: 6px;
      font-weight: 500;
      opacity: .7;
    }

    /* ─── Team Grid ────────────────────────────────────────────────────── */
    #team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    /* team card */
    .team-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 28px 20px 22px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      position: relative;
      overflow: hidden;
    }

    .team-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-light) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .25s;
    }

    .team-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
    }

    .team-card:hover::before { opacity: 1; }

    .team-card .card-photo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 14px;
      overflow: hidden;
      border: 3px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: border-color .2s;
      position: relative;
      z-index: 1;
    }

    .team-card:hover .card-photo-wrap { border-color: var(--accent); }

    .team-card .card-photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .team-card .card-name {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
      position: relative;
      z-index: 1;
    }

    .team-card .card-title {
      font-size: .78rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .team-card .card-location {
      font-size: .75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .team-card .card-bio {
      font-size: .8rem;
      color: var(--text-secondary);
      line-height: 1.55;
      position: relative;
      z-index: 1;
    }

    /* ─── Pin icon SVG ─────────────────────────────────────────────────── */
    .icon-pin {
      display: inline-block;
      width: 11px;
      height: 11px;
      flex-shrink: 0;
    }

    /* ─── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #map { height: 380px; }
      /* Keep the popup short enough to fit inside the shorter mobile map */
      .mapboxgl-popup-content { min-width: 200px; max-width: 230px; }
      .popup-card .popup-photo { height: 92px; }
      header { padding: 36px 20px 28px; }
      main { padding: 32px 16px 60px; }
    }
  </style>
</head>

  }

  // ─────────────────────────────────────────────────────────────────────────
  //  HELPER — fly map to a member and open their popup
  // ─────────────────────────────────────────────────────────────────────────
  function focusMember(member, zoom) {
    zoom = zoom || 5;

    // Close any open popup first
    if (activePopup) { activePopup.remove(); activePopup = null; }

    const dx = pinOffsetX.get(member) || 0;

    // Mapbox renders popups INSIDE the map container, which is overflow:hidden.
    // A popup opens upward from the pin, so if the pin sits at the vertical
    // centre there isn't enough room above it and the top of the card gets
    // clipped. Nudging the camera target downward puts the pin lower in the
    // frame and leaves headroom for the card.
    const mapH = map.getContainer().clientHeight;
    const drop = Math.round(mapH * 0.18);

    map.flyTo({
      center: [member.longitude, member.latitude],
      offset: [dx, drop],
      zoom: zoom,
      speed: 1.4,
      curve: 1.4
    });

    activePopup = new mapboxgl.Popup({
        anchor: 'bottom',
        offset: [dx, -46],
        closeButton: true,
        maxWidth: '280px'
      })
      .setLngLat([member.longitude, member.latitude])
      .setHTML(buildPopupHTML(member))
      .addTo(map);

    activePopup.on('close', () => { activePopup = null; });

    // Safety net: once the camera settles, measure the card as rendered. If any
    // of it is still above the top edge (tall bio, short viewport, zoomed-out
    // browser), pan just far enough to bring it fully into view.
    const popupRef = activePopup;
    map.once('moveend', function() {
      requestAnimationFrame(function() {
        if (popupRef !== activePopup) return;      // superseded by another click
        const el = popupRef.getElement();
        if (!el) return;
        const PAD = 12;
        const mapTop = map.getContainer().getBoundingClientRect().top;
        const overflow = (mapTop + PAD) - el.getBoundingClientRect().top;
        if (overflow > 0) map.panBy([0, -overflow], { duration: 260 });
      });
    });

    // Scroll to map
    document.getElementById('map-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ─────────────────────────────────────────────────────────────────────────
  //  ADD MARKERS + BUILD TEAM GRID
  // ─────────────────────────────────────────────────────────────────────────
  const grid = document.getElementById('team-grid');

  // ───────────────────────────────────────────────────────────────────────
  //  CO-LOCATION OFFSETS
  //  Two people in the same city share a coordinate, so their pins would sit
  //  exactly on top of each other. Rather than faking the coordinates (which
  //  drifts wrong as you zoom in), each pin in a shared city gets a fixed
  //  PIXEL offset. Pixel offsets are zoom-independent, so the pins stay the
  //  same distance apart whether you're looking at the whole world or one
  //  street — and the underlying coordinate stays truthful.
  //
  //  Pins are 40px wide; PIN_SPACING of 48 leaves a visible gap between them.
  //  Nothing to maintain: add a third person to a city and the fan widens
  //  automatically.
  // ───────────────────────────────────────────────────────────────────────
  const PIN_SPACING = 48;

  const markerByMember = new Map();
  const cardByMember   = new Map();

  const cityGroups = {};
  teamMembers.forEach(function(member) {
    const key = member.location.trim().toLowerCase();
    (cityGroups[key] = cityGroups[key] || []).push(member);
  });

  const pinOffsetX = new Map();

  // Fan out whichever members are currently visible. Recomputed on every filter
  // change so that filtering down to one person per city re-centres their pin
  // on its true coordinate instead of leaving it offset for an absent colleague.
  function recomputeOffsets(visibleMembers) {
    pinOffsetX.clear();
    const groups = {};
    visibleMembers.forEach(function(member) {
      const key = member.location.trim().toLowerCase();
      (groups[key] = groups[key] || []).push(member);
    });
    Object.keys(groups).forEach(function(key) {
      const group = groups[key];
      // Centre the fan on the true coordinate: 2 people -> -24/+24, 3 -> -48/0/+48
      const start = -((group.length - 1) * PIN_SPACING) / 2;
      group.forEach(function(member, i) {
        pinOffsetX.set(member, start + i * PIN_SPACING);
      });
    });
  }

  recomputeOffsets(teamMembers);


  teamMembers.forEach(function(member) {

    // ── Map marker ──────────────────────────────────────────────────────
    // Outer wrapper — this is what Mapbox anchors. No CSS transform on
    // this element, so the anchor point is always pixel-accurate.
    const wrap = document.createElement('div');
    wrap.className = 'marker-wrap';
    wrap.title = member.name;

    // Inner pin — rotated diamond with the photo inside
    const pin = document.createElement('div');
    pin.className = 'marker-pin';

    const img = document.createElement('img');
    img.src = member.photo;
    img.alt = member.name;
    // If a headshot file is missing, fall back to generated initials
    img.onerror = function() { this.onerror = null; this.src = avatar(member.name); };
    pin.appendChild(img);
    wrap.appendChild(pin);

    wrap.addEventListener('click', function(e) {
      e.stopPropagation();
      focusMember(member, 5);
    });

    // anchor: 'bottom-left' aligns the bottom-left corner of the wrapper
    // (which is the tip of the rotated diamond) exactly to the coordinate.
    const marker = new mapboxgl.Marker({ element: wrap, offset: [pinOffsetX.get(member) || 0, 0] })
      .setLngLat([member.longitude, member.latitude])
      .addTo(map);
    markerByMember.set(member, marker);

    // ── Team card ────────────────────────────────────────────────────────
    const card = document.createElement('div');
    card.className = 'team-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', 'View ' + member.name + ' on map');

    card.innerHTML =
      '<div class="card-photo-wrap">' +
        '<img src="' + member.photo + '" alt="' + member.name + '" loading="lazy" ' +
          'onerror="this.onerror=null;this.src=\'' + avatar(member.name) + '\'" />' +
      '</div>' +
      '<div class="card-name">' + member.name + '</div>' +
      '<div class="card-title">' + member.title + '</div>' +
      '<div class="card-location">' +
        '<svg class="icon-pin" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M8 1.5C5.51 1.5 3.5 3.51 3.5 6c0 3.75 4.5 8.5 4.5 8.5s4.5-4.75 4.5-8.5c0-2.49-2.01-4.5-4.5-4.5Zm0 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="#6b7280"/>' +
        '</svg>' +
        member.location +
      '</div>' +
      '<div class="card-bio">' + member.bio + '</div>';

    card.addEventListener('click', function() { focusMember(member, 5); });
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusMember(member, 5); }
    });

    grid.appendChild(card);
    cardByMember.set(member, card);
  });


  // ───────────────────────────────────────────────────────────────────────
  //  TEAM FILTER
  //  One control drives both the map pins and the grid below.
  // ───────────────────────────────────────────────────────────────────────
  const TEAMS = [
    { id: 'all',   label: 'Everyone' },
    { id: 'eng',   label: 'Eng'      },
    { id: 'cs',    label: 'CS'       },
    { id: 'sales', label: 'Sales'    }
  ];

  const filterBar = document.getElementById('filter-bar');
  let activeTeam = 'all';

  function membersInTeam(teamId) {
    return teamId === 'all'
      ? teamMembers
      : teamMembers.filter(function(m) { return m.team === teamId; });
  }

  function applyFilter(teamId) {
    activeTeam = teamId;

    // An open popup may belong to someone now hidden — close it either way.
    if (activePopup) { activePopup.remove(); activePopup = null; }

    const visible = membersInTeam(teamId);
    const visibleSet = new Set(visible);

    // Re-fan the pins for just this subset, then show/hide everything.
    recomputeOffsets(visible);

    teamMembers.forEach(function(member) {
      const shown  = visibleSet.has(member);
      const marker = markerByMember.get(member);
      const card   = cardByMember.get(member);

      if (marker) {
        marker.setOffset([pinOffsetX.get(member) || 0, 0]);
        marker.getElement().style.display = shown ? '' : 'none';
      }
      if (card) card.style.display = shown ? '' : 'none';
    });

    // Update button state
    Array.prototype.forEach.call(filterBar.children, function(btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.team === teamId));
    });

    // Frame the people who are left
    fitTo(visible);
  }

  // Fit the map around a set of members, with a sane fallback for one person
  function fitTo(members) {
    if (!members.length) return;

    if (members.length === 1) {
      map.flyTo({ center: [members[0].longitude, members[0].latitude], zoom: 4, speed: 1.2 });
      return;
    }

    const bounds = new mapboxgl.LngLatBounds();
    members.forEach(function(m) { bounds.extend([m.longitude, m.latitude]); });

    map.fitBounds(bounds, {
      padding: { top: 60, bottom: 60, left: 60, right: 60 },
      maxZoom: 4.5,
      duration: 900
    });
  }

  TEAMS.forEach(function(team) {
    const count = membersInTeam(team.id).length;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-btn';
    btn.dataset.team = team.id;
    btn.setAttribute('aria-pressed', String(team.id === 'all'));
    btn.innerHTML = team.label + '<span class="filter-count">' + count + '</span>';
    btn.addEventListener('click', function() { applyFilter(team.id); });

    filterBar.appendChild(btn);
  });

  </script>
</body>
</html>
